<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" class="display" readonly placeholder="0">
    
    <div class="buttons">
      <!-- Row 1 -->
      <button id="clear" class="btn fn">C</button>
      <button data-value="(" class="btn fn">(</button>
      <button data-value=")" class="btn fn">)</button>
      <button id="backspace" class="btn fn">⌫</button>
      
      <!-- Row 2 -->
      <button data-value="7" class="btn">7</button>
      <button data-value="8" class="btn">8</button>
      <button data-value="9" class="btn">9</button>
      <button data-value="/" class="btn op">÷</button>
      
      <!-- Row 3 -->
      <button data-value="4" class="btn">4</button>
      <button data-value="5" class="btn">5</button>
      <button data-value="6" class="btn">6</button>
      <button data-value="*" class="btn op">×</button>
      
      <!-- Row 4 -->
      <button data-value="1" class="btn">1</button>
      <button data-value="2" class="btn">2</button>
      <button data-value="3" class="btn">3</button>
      <button data-value="-" class="btn op">−</button>
      
      <!-- Row 5 -->
      <button data-value="0" class="btn zero">0</button>
      <button data-value="." class="btn">.</button>
      <button id="equals" class="btn equals">=</button>
      <button data-value="+" class="btn op">+</button>
    </div>
    
    <div class="advanced-buttons">
      <button data-value="^" class="btn sm">xʸ</button>
      <button data-value="%" class="btn sm">%</button>
    </div>
  </div>
  
  <footer>
    <p>Keyboard supported: numbers, operators, Enter, Backspace, Esc</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
